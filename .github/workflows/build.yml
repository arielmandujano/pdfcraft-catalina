name: Build Craft apps for Catalina

# Compila las apps de la Craft App Suite (storytold/*) para macOS 10.15 Catalina en Intel (x86_64).
# Sin forks: cada job clona el tag de apps.json, patch.sh baja el target de despliegue de 11.0 a
# 10.15 y luego corre el script de empaquetado oficial de la app. check-binaries.sh verifica el
# resultado antes de subirlo.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App a compilar (todas = las 13)"
        type: choice
        default: todas
        options:
          - todas
          - photocraft
          - vectorcraft
          - filmcraft
          - lightcraft
          - pdfcraft
          - effectcraft
          - designcraft
          - wordcraft
          - deckcraft
          - gridcraft
          - cadcraft
          - soundcraft
          - figcraft
      ref:
        description: "Tag o rama de upstream (vacío = el de apps.json; solo con una app)"
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Elegir apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Armar la matriz desde apps.json
        id: matrix
        env:
          APP: ${{ inputs.app }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ] && [ "$APP" = "todas" ]; then
            echo "::error::'ref' solo se puede usar eligiendo una app concreta"
            exit 1
          fi
          matrix="$(jq -c --arg app "$APP" --arg ref "$REF" '
            [ .[] | select($app == "todas" or .id == $app)
                  | if $ref != "" then .ref = $ref else . end ]
            | { include: . }' apps.json)"
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }} ${{ matrix.ref }}
    needs: plan
    # Runner Intel: compila nativo para x86_64 y puede ejecutar los binarios para verificarlos.
    runs-on: macos-15-intel
    # LTO + codegen-units=1 en 4 núcleos tarda; la primera vez sin caché es la más lenta.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout de este repo (scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scripts

      - name: Checkout de ${{ matrix.id }} ${{ matrix.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/${{ matrix.id }}
          ref: ${{ matrix.ref }}
          path: app

      - name: Checkout de craft-fonts
        if: matrix.fonts != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ matrix.fonts }}
          path: craft-fonts

      - name: Configurar craft-fonts
        if: matrix.fonts != ''
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Caché de cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app -> target
          key: catalina-x86_64-${{ matrix.id }}-${{ matrix.ref }}

      - name: Parchear el target de despliegue a 10.15
        run: bash scripts/patch.sh app

      - name: Compilar y empaquetar (firma ad-hoc, sin notarizar)
        id: package
        working-directory: app
        env:
          MACOS_SIGN_IDENTITY: "-"
        run: bash packaging/macos/package.sh --arch x86_64

      - name: Verificar binarios para 10.15
        run: bash scripts/check-binaries.sh app "${{ matrix.name }}"

      # Se sube aunque la verificación falle (el job queda en rojo), para poder probarlo igual.
      - name: Subir DMG y CLI
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.id }}-${{ matrix.ref }}-catalina-x86_64
          path: app/dist/release/*
          if-no-files-found: error
          retention-days: 30
